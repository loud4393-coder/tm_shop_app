<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turkmenistan Fashion Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: var(--tg-theme-button-color, #0052CC);
            --primary-text: var(--tg-theme-button-text-color, #FFFFFF);
            --bg-color: var(--tg-theme-bg-color, #F8F9FA);
            --card-bg: var(--tg-theme-secondary-bg-color, #FFFFFF);
            --text-color: var(--tg-theme-text-color, #172B4D);
            --text-secondary: var(--tg-theme-hint-color, #6B778C);
            --border-color: rgba(9, 30, 66, 0.1);
            --accent-red: #FF5630;
            --accent-red-bg: rgba(255, 86, 48, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .icon-btn:active {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .brand-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.3px;
            cursor: pointer;
        }

        .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: var(--accent-red);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            border-radius: 10px;
            padding: 2px 5px;
            min-width: 16px;
            text-align: center;
            line-height: 1;
        }

        .lang-switch {
            display: flex;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 2px;
            border: 1px solid var(--border-color);
        }

        .lang-btn {
            border: none;
            background: none;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--primary);
            color: var(--primary-text);
        }

        /* --- Drawer / Sidebar --- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background-color: var(--card-bg);
            z-index: 201;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 700;
        }

        .sidebar-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .sidebar-categories {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .category-item {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-item:active, .category-item.active {
            background-color: rgba(0, 82, 204, 0.08);
            color: var(--primary);
        }

        /* --- Main Container --- */
        .container {
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
        }

        .active-filter-tag {
            font-size: 12px;
            background: rgba(0, 82, 204, 0.1);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* --- Catalog Grid --- */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 600px) {
            .catalog-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .btn-fav-card {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            z-index: 2;
        }

        .product-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #E2E8F0;
            margin-bottom: 8px;
        }

        .product-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 34px;
        }

        .product-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .btn-card-action {
            width: 100%;
            background-color: rgba(0, 82, 204, 0.08);
            color: var(--primary);
            border: none;
            padding: 8px 0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        /* --- Views Management --- */
        .view-page {
            display: none;
        }

        .view-page.active {
            display: block;
        }

        /* --- Detail Page --- */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            margin-bottom: 12px;
            padding: 4px 0;
        }

        .detail-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .gallery-container {
            margin-bottom: 16px;
            position: relative;
        }

        .main-gallery-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
            background-color: #E2E8F0;
            margin-bottom: 10px;
        }

        .thumbnails-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .thumb-img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.7;
            transition: all 0.2s;
        }

        .thumb-img.active {
            border-color: var(--primary);
            opacity: 1;
        }

        .detail-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .detail-title {
            font-size: 20px;
            font-weight: 700;
            flex: 1;
            padding-right: 12px;
        }

        .detail-price {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .option-section {
            margin-bottom: 16px;
        }

        .option-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .size-chips, .color-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .size-chip {
            padding: 8px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            background: var(--bg-color);
            transition: all 0.2s;
            color: var(--text-color);
        }

        .size-chip.selected {
            border-color: var(--primary);
            background-color: var(--primary);
            color: var(--primary-text);
        }

        .color-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: var(--bg-color);
            transition: all 0.2s;
            color: var(--text-color);
        }

        .color-chip.selected {
            border-color: var(--primary);
            background-color: rgba(0, 82, 204, 0.08);
            font-weight: 700;
        }

        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }

        .detail-description {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-color);
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .btn-add-detail {
            width: 100%;
            background-color: var(--primary);
            color: var(--primary-text);
            border: none;
            padding: 14px 0;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(0, 82, 204, 0.2);
            transition: opacity 0.2s;
        }

        .btn-add-detail:active {
            opacity: 0.9;
        }

        /* --- Cart & Checkout Page --- */
        .checkout-section {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .cart-items-summary {
            max-height: 240px;
            overflow-y: auto;
            margin-bottom: 16px;
            padding-right: 4px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .cart-item-title {
            font-weight: 600;
        }

        .cart-item-meta {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-qty-mini {
            width: 26px;
            height: 26px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-weight: bold;
            color: var(--primary);
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: var(--card-bg);
            color: var(--text-color);
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .radio-label input {
            margin-right: 10px;
            accent-color: var(--primary);
        }

        .radio-label.selected {
            border-color: var(--primary);
            background-color: rgba(0, 82, 204, 0.04);
            font-weight: 600;
        }

        .velayat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .velayat-btn {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-color);
        }

        .velayat-btn.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: var(--primary-text);
        }

        .info-box {
            background-color: rgba(0, 82, 204, 0.05);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--primary);
            margin-top: 6px;
            line-height: 1.4;
        }

        .summary-box {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .summary-row.total {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-color);
            margin-top: 8px;
        }

        /* --- Empty state --- */
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .btn-empty-action {
            background: var(--primary);
            color: var(--primary-text);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Upper Control Bar (Header) -->
    <header>
        <div class="header-left">
            <button class="icon-btn" id="btn-menu" onclick="toggleSidebar()" aria-label="Menu">☰</button>
            <div class="brand-title" onclick="switchView('catalog')">TM FASHION</div>
        </div>
        <div class="header-right">
            <div class="lang-switch">
                <button class="lang-btn active" id="btn-ru" onclick="switchLanguage('ru')">RU</button>
                <button class="lang-btn" id="btn-tk" onclick="switchLanguage('tk')">TK</button>
            </div>
            <button class="icon-btn" onclick="switchView('favorites')" aria-label="Favorites">
                ❤️ <span class="badge" id="fav-count">0</span>
            </button>
            <button class="icon-btn" onclick="switchView('cart')" aria-label="Cart">
                🛒 <span class="badge" id="cart-count">0</span>
            </button>
        </div>
    </header>

    <!-- Drawer / Sidebar categories -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title" id="sidebar-cat-title">Категории</div>
            <button class="sidebar-close" onclick="closeSidebar()">✕</button>
        </div>
        <div class="sidebar-categories" id="sidebar-categories-list"></div>
    </aside>

    <div class="container">
        <!-- 1. Catalog View -->
        <main id="catalog-view" class="view-page active">
            <div class="section-header">
                <div class="section-title" id="title-catalog">Каталог одежды</div>
                <div class="active-filter-tag" id="active-category-tag">Все товары</div>
            </div>
            <div class="catalog-grid" id="catalog"></div>
        </main>

        <!-- 2. Favorites View -->
        <section id="favorites-view" class="view-page">
            <div class="section-title" id="title-favorites">Избранное</div>
            <div id="favorites-content"></div>
        </section>

        <!-- 3. Product Detail View -->
        <section id="product-view" class="view-page">
            <button class="btn-back" onclick="closeProductDetail()">
                <span id="btn-back-text">← Назад</span>
            </button>
            <div class="detail-card" id="detail-card-content"></div>
        </section>

        <!-- 4. Cart & Checkout View -->
        <section id="cart-view" class="view-page">
            <div class="section-title" id="title-cart">Корзина и оформление</div>
            <div id="cart-content"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
